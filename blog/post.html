<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css">
</head>

<body class="bg-slate-900 text-white">

  <div class="max-w-5xl mx-auto px-6 py-20">

    <a href="../index.html" class="text-teal-400 hover:underline">
      ← Back to Home
    </a>

    <!-- SEARCH -->
    <input id="search" type="text" placeholder="Search blog posts..."
      class="w-full mt-6 p-3 rounded-lg bg-slate-800 border border-slate-700">

    <!-- TAGS -->
    <div id="tag-bar" class="flex flex-wrap gap-2 mt-4"></div>

    <!-- LIST -->
    <div id="blog-list" class="grid md:grid-cols-2 gap-6 mt-10"></div>

    <!-- SINGLE POST -->
    <div id="blog-content" class="mt-16 hidden"></div>

  </div>

  <script>
    function getQueryParam(param) {
      return new URLSearchParams(window.location.search).get(param);
    }

    let ALL_POSTS = [];
    let ACTIVE_TAGS = new Set();

    function normTag(t) {
      return (t || "").trim().toLowerCase();
    }

    // =========================
    // LOAD POSTS
    // =========================
    async function loadPostsList() {
      const res = await fetch("./index.json");
      ALL_POSTS = await res.json();

      renderTagBar(ALL_POSTS);
      renderPosts(ALL_POSTS);

      document.getElementById("search").addEventListener("input", (e) => {
        filterPosts(e.target.value);
      });
    }

    // =========================
    // TAG BAR
    // =========================
    function renderTagBar(posts) {
      const tagBar = document.getElementById("tag-bar");
      tagBar.innerHTML = "";

      const tags = new Set();

      posts.forEach(p => {
        (p.tags || []).forEach(tag => tags.add(normTag(tag)));
      });

      [...tags].sort().forEach(tag => {
        const btn = document.createElement("button");

        const isActive = ACTIVE_TAGS.has(tag);

        btn.textContent = tag;
        btn.className =
          "px-3 py-1 rounded-full text-sm border transition " +
          (isActive
            ? "bg-teal-500 text-black border-teal-400"
            : "bg-slate-800 border-slate-700 hover:border-teal-400");

        btn.onclick = () => {
          if (ACTIVE_TAGS.has(tag)) {
            ACTIVE_TAGS.delete(tag);
          } else {
            ACTIVE_TAGS.add(tag);
          }

          filterPosts(document.getElementById("search").value);
        };

        tagBar.appendChild(btn);
      });
    }

    // =========================
    // FILTER (AND LOGIC)
    // =========================
    function filterPosts(query = "") {
      query = query.toLowerCase();

      const filtered = ALL_POSTS.filter(post => {
        const title = (post.title || "").toLowerCase();
        const summary = (post.summary || "").toLowerCase();

        const postTags = (post.tags || []).map(normTag);

        const textMatch =
          title.includes(query) ||
          summary.includes(query);

        const tagMatch =
          ACTIVE_TAGS.size === 0 ||
          [...ACTIVE_TAGS].every(tag => postTags.includes(tag));

        return textMatch && tagMatch;
      });

      renderPosts(filtered);
      renderTagBar(ALL_POSTS);
    }

    // =========================
    // RENDER LIST
    // =========================
    function renderPosts(posts) {
      const container = document.getElementById("blog-list");
      container.innerHTML = "";

      posts.forEach(post => {
        const el = document.createElement("a");

        el.href = `?id=${post.id}`;
        el.className =
          "block p-6 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-teal-500 transition";

        el.innerHTML = `
          <h3 class="text-lg font-semibold">${post.title}</h3>

          <p class="text-sm text-slate-400 mt-2">
            ${post.summary || ""}
          </p>

          <div class="flex flex-wrap gap-1 mt-3">
            ${(post.tags || []).map(t => `
              <span class="text-xs px-2 py-1 bg-slate-700 rounded-full text-slate-300">
                ${t}
              </span>
            `).join("")}
          </div>

          <span class="text-xs text-slate-500 block mt-3">
            ${post.date || ""}
          </span>
        `;

        container.appendChild(el);
      });
    }

    // =========================
    // SINGLE POST VIEW
    // =========================
    async function loadPost(id) {
      const res = await fetch(`./posts/${id}.json`);
      const post = await res.json();

      document.getElementById("blog-list").style.display = "none";
      document.getElementById("search").style.display = "none";
      document.getElementById("tag-bar").style.display = "none";

      const container = document.getElementById("blog-content");
      container.classList.remove("hidden");

      container.innerHTML = `
        <h1 class="text-4xl font-bold mb-4">${post.title}</h1>

        <p class="text-slate-500 mb-6">
          ${new Date(post.date).toLocaleDateString()} ${post.author ? "• " + post.author : ""}
        </p>

        <div class="prose prose-invert max-w-none">
          ${post.content}
        </div>
      `;
    }

    // =========================
    // INIT
    // =========================
    document.addEventListener("DOMContentLoaded", () => {
      const id = getQueryParam("id");

      if (id) {
        loadPost(id);
      } else {
        loadPostsList();
      }
    });
  </script>

</body>
</html>
